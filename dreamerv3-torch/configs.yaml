defaults:

  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  deterministic_run: False
  steps: 300000
  parallel: False
  eval_every: 2e4
  eval_episode_num: 100
  log_every: 1e4
  reset_every: 0
  device: 'cpu'
  compile: True
  precision: 32
  debug: False
  video_pred_log: False # was True
  stage: 1
  lidar: 360
  odometry_mode: 'none'
  resource_logging: true
  log_videos: true
  csv_dir: './csv_logs'             # base dir for all per-run CSVs (BO trials use a subfolder)
  plots_dir: './path_plots'         # base dir for path-plot PNGs (BO trials use a subfolder)

  # Reward shaping (opt-in; default mode = original sparse reward, unchanged)
  reward_mode: 'default'            # 'default' | 'shaped' | 'pbrs'
  reward_progress_scale: 1.0
  reward_step_penalty: 0.01
  reward_turn_penalty: 0.01
  reward_near_obstacle_scale: 0.1
  reward_near_obstacle_sigma: 0.25

  # Potential-based reward shaping (reward_mode='pbrs'). Auxiliary, policy-invariant
  # (Ng, Harada & Russell 1999) when pbrs_gamma == agent discount (0.997). Φ(s) =
  # -(distance_weight*d_norm + angle_weight*a_norm); F = pbrs_scale*(γ·Φ(s') − Φ(s)).
  # distance_scale fixed at 5.0 (comparable across stages; never saturates on 1–4).
  pbrs_scale: 1.0
  pbrs_distance_weight: 1.0
  pbrs_angle_weight: 0.2
  pbrs_distance_scale: 5.0
  pbrs_gamma: 0.997

  # Environment
  task: 'turtle'
  time_limit: 250
  prefill: 500
  reward_EMA: True

  # Model
  dyn_hidden: 256
  dyn_deter: 256
  dyn_stoch: 16
  dyn_discrete: 16
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  grad_heads: ['decoder', 'reward', 'cont']
  units: 256
  act: 'SiLU'
  norm: True
  encoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 512, symlog_inputs: True}
  decoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 512, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
  actor:
    {layers: 2, dist: 'normal', entropy: 3e-4, unimix_ratio: 0.01, std: 'learned', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic:
    {layers: 2, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  reward_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  cont_head:
    {layers: 2, loss_scale: 1.0, outscale: 1.0}
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'


  # Training
  batch_size: 16
  batch_length: 64
  train_ratio: 512
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  dataset_size: 1e6
  opt: 'adam'

  # Behavior.
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 15
  imag_gradient: 'dynamics'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Exploration
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

turtle:
  steps: 600000
  log_every: 2e3
  action_repeat: 1
  envs: 1
  train_ratio: 512
  parallel: False
  video_pred_log: false
  encoder: {mlp_keys: '.*', cnn_keys: '$^'}
  decoder: {mlp_keys: '.*', cnn_keys: '$^'}
  device: 'cpu'
  precision: 32
  lidar: 360
  odometry_mode: 'none'
  resource_logging: true
  log_videos: false